# إعدادات الإيجنت. غيّر القيم هون بدل ما تعدّل الكود.
brand:
  name: "دليل الذكي"
  handle: "@daleel.ai"
  tagline: "كل يوم أداة ذكاء اصطناعي بتسهّل شغلك"
  # بيتعبّى تلقائياً من GitHub Pages. إذا ربطت دومين خاص، حطه هون.
  site_url: "https://yazanmaharmehai-oss.github.io/daleel-agent"

markets: ["السعودية", "الإمارات", "الكويت", "قطر", "الأردن"]

ai:
  # auto = Claude إذا في مفتاح ANTHROPIC_API_KEY، وإلا Gemini المجاني
  provider: "auto"
  # أسماء نماذج Gemini المجانية بتتغير. الإيجنت بيجرب بالترتيب لحد ما واحد يشتغل.
  gemini_models: ["gemini-flash-latest", "gemini-3.8-flash", "gemini-3-flash-preview", "gemini-2.5-flash"]
  claude_model: "claude-opus-5-5"
  max_tokens: 16000

research:
  # عدد نتائج Tavily لكل بحث
  max_results: 6
  # مواقع ما بنعتمد عليها كمصدر للحقائق
  exclude_domains: ["pinterest.com", "tiktok.com", "facebook.com"]

voice:
  enabled: true
  # gemini = صوت جوجل (أوضح، بدو GEMINI_API_KEY). edge = صوت مايكروسوفت المجاني بدون مفتاح.
  # إذا صوت جوجل ما اشتغل، الإيجنت بيرجع لـ edge لحاله.
  engine: "edge"
  gemini_voice: "Charon"
  gemini_style: "اقرأ النص التالي بالعربية بصوت واضح وهادئ وسرعة متوسطة، كأنك تشرح لصديق"
  gemini_models: ["gemini-3.1-flash-tts-preview", "gemini-2.5-flash-preview-tts"]
  # يزن اختار ar-EG-ShakirNeural (2026-10-30). أصوات Edge العربية: ar-SA-HamedNeural, ar-SA-ZariyahNeural, ar-AE-HamdanNeural, ar-JO-TaimNeural, ar-JO-SanaNeural
  name: "ar-EG-ShakirNeural"
  rate: "-5%"

video:
  fps: 30
  # أقل مدة للمشهد بالثواني لو ما في صوت
  min_scene_seconds: 2.6

schedule:
  # كم يوم لازم يمر قبل ما نرجع لنفس المنتج
  product_cooldown_days: 21
  # بعد ما توصلك المسودة، الإيجنت بيضل يستنى ردك هالمدة (دقايق) عشان ينفذ فوراً
  approval_wait_minutes: 120

pinterest:
  enabled: false
  board_id: ""
