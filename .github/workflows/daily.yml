name: daily-draft
# كل يوم 6 الصبح UTC (9 بتوقيت السعودية): بحث، كتابة، صوت، فيديو، وبعت للموافقة على تيليغرام.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      product:
        description: "id منتج معين من products.yaml (اختياري)"
        default: ""
      draft_id:
        description: "لإعادة كتابة مسودة موجودة (بيستعمله البوت)"
        default: ""
      feedback:
        description: "ملاحظاتك على المسودة"
        default: ""
      dry_run:
        description: "تجربة بدون مفاتيح ولا حفظ"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: daleel-state
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # always the newest state: a queued run must see what the previous run pushed
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: npm ci
        working-directory: video
      - name: Make today's draft and wait for approval
        id: make
        run: |
          args=()
          [ -n "$PRODUCT" ] && args+=(--product "$PRODUCT")
          [ -n "$DRAFT_ID" ] && args+=(--draft-id "$DRAFT_ID")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python -m agent daily "${args[@]}" --feedback "$FEEDBACK"
        env:
          PRODUCT: ${{ inputs.product }}
          DRAFT_ID: ${{ inputs.draft_id }}
          DRY_RUN: ${{ inputs.dry_run }}
          FEEDBACK: ${{ inputs.feedback }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: video
          path: drafts/*/media/video.mp4
          retention-days: 7
          if-no-files-found: ignore
      - name: Save state
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "daleel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state drafts site/content site/static/covers
          git diff --cached --quiet && exit 0
          git commit -m "draft: $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish the site now if approved
        if: ${{ steps.make.outputs.publish == 'true' }}
        run: gh workflow run approvals.yml
