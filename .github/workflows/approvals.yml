name: approvals-and-site
# كل 20 دقيقة: بيقرأ أزرار تيليغرام. إذا وافقت على مسودة، بيبني الموقع وبينشره على GitHub Pages.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["products.yaml", "config.yaml", "site/static/**", "agent/site.py"]

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

# own group: sharing one with daily.yml let a scheduled run cancel a queued draft
concurrency:
  group: daleel-approvals
  cancel-in-progress: false

jobs:
  approvals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.tg.outputs.publish }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # always the newest state: a queued run must see what the previous run pushed
      - uses: actions/checkout@v4
        with:
          ref: main
      # the daily job reads Telegram itself while it waits for approval; don't compete with it
      - name: Is the daily job running?
        id: busy
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow daily.yml --json status \
                -q '[.[] | select(.status=="in_progress" or .status=="queued")] | length')
          echo "busy=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: ${{ steps.busy.outputs.busy != 'true' }}
        with:
          python-version: "3.12"
          cache: pip
      - if: ${{ steps.busy.outputs.busy != 'true' }}
        run: pip install -r requirements.txt
      - id: tg
        if: ${{ steps.busy.outputs.busy != 'true' }}
        run: python -m agent approvals
      - name: Save state
        if: ${{ steps.busy.outputs.busy != 'true' }}
        run: |
          git config user.name "daleel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state drafts site/content
          git diff --cached --quiet && exit 0
          git commit -m "approvals: $(date -u +'%F %H:%M')"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: approvals
    if: ${{ needs.approvals.outputs.publish == 'true' || github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m agent build
      # a unique name per attempt, so "Re-run" doesn't find two artifacts with the same name
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build
          name: github-pages-${{ github.run_attempt }}
      - id: pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
