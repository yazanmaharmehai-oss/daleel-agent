name: voice-samples
# نفس الجملة بكذا صوت، بتوصلك على تيليغرام وبتنحفظ هون (Artifacts) عشان تختار الأوضح.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m agent voices
      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: samples/
          retention-days: 14
